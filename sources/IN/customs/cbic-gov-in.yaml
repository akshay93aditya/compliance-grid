notes: |
  Central indirect tax and customs board. **Confirmed still blocked
  2026-06-07** — both plain curl (connection reset) and WebFetch
  (returns essentially empty content, just the page title) fail to
  retrieve the navigation tree. Sister surfaces cbic-gst.gov.in,
  taxinformation.cbic.gov.in, and ICEGATE remain extraction-ready and
  are the recommended primary routes.
  
  2026-06-07: CBIC root returns 200 to vanilla Chrome UA — was UA-discrimination only. The earlier 2026-06-07 WebFetch returning a near-empty page was a separate WebFetch-tool artefact; plain curl with browser UA + Accept-Language gets a full page.

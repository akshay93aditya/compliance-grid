notes: |
  Tamil Nadu Real Estate Regulatory Authority — state RERA under
  the Real Estate (Regulation and Development) Act, 2016. **2026-06-07
  browser-acquire smoke discovered the domain has been parked** —
  Playwright loads a 15 KB shell that contains only 2 anchors, both
  to mydomaincontact.com / "#" placeholder. The earlier curl-get probe
  saw the loading-shell text; turns out that shell never resolves to
  real content because the underlying app is gone. Adding to the
  squatter-watch list.

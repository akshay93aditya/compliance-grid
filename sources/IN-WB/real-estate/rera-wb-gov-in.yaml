notes: |
  West Bengal Real Estate Regulatory Authority. After the SC's 2021
  ruling striking down the WB HIRA Act, the state was directed to
  enforce the central RERA, 2016. rera.wb.gov.in is the current
  canonical RERA portal. The legacy hira.wb.gov.in domain still
  resolves but represents the defunct statutory regime; indexed
  here is the post-2021 RERA authority. URL was verified reachable
  via HEAD on 2026-06-07.
